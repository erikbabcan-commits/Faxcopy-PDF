# Source is reviewed in pull requests; this workflow never commits to main.
name: Validate archived distribution
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python -m zipfile -t presspilot-mvp-v0.1.0.zip
