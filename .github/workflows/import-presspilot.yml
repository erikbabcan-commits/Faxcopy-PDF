name: Import PressPilot source

on:
  push:
    branches: [main]
    paths:
      - presspilot-mvp-v0.1.0.zip
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: presspilot-import-main
  cancel-in-progress: false

jobs:
  unpack:
    if: github.repository == 'erikbabcan-commits/Faxcopy-PDF' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Validate and extract source archive
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import re
          import stat
          import subprocess
          import zipfile

          root = Path.cwd().resolve()
          archive = root / "presspilot-mvp-v0.1.0.zip"
          if not archive.is_file():
              raise SystemExit("Required source archive missing")

          skipped = {
              Path("README.md"),
              Path(".github/workflows/ci.yml"),
          }
          max_entries = 500
          max_total = 80 * 1024 * 1024
          max_ratio = 200

          with zipfile.ZipFile(archive) as source:
              entries = source.infolist()
              if len(entries) > max_entries:
                  raise SystemExit("Too many archive entries")
              if sum(entry.file_size for entry in entries) > max_total:
                  raise SystemExit("Archive too large")
              if source.testzip() is not None:
                  raise SystemExit("Archive CRC validation failed")

              seen = set()
              files = []
              for entry in entries:
                  raw = entry.filename
                  normalized = raw[:-1] if entry.is_dir() and raw.endswith("/") else raw
                  path = PurePosixPath(normalized)
                  mode = entry.external_attr >> 16
                  kind = stat.S_IFMT(mode)
                  if (
                      not normalized
                      or "\\" in raw
                      or not re.fullmatch(r"[A-Za-z0-9._/-]+", normalized)
                      or path.is_absolute()
                      or path.as_posix() != normalized
                      or any(part in ("", ".", "..") for part in path.parts)
                      or path.parts[0] != "presspilot-mvp"
                  ):
                      raise SystemExit(f"Unsafe archive path: {raw!r}")
                  if kind == stat.S_IFLNK or (kind and kind != (stat.S_IFDIR if entry.is_dir() else stat.S_IFREG)):
                      raise SystemExit(f"Unsupported archive entry type: {raw}")
                  if entry.flag_bits & 1:
                      raise SystemExit(f"Encrypted archive entry rejected: {raw}")
                  if entry.file_size and (
                      entry.compress_size == 0
                      or entry.file_size / entry.compress_size > max_ratio
                  ):
                      raise SystemExit(f"Suspicious compression ratio: {raw}")
                  relative = Path(*path.parts[1:])
                  if not relative.parts:
                      continue
                  if relative in seen:
                      raise SystemExit(f"Duplicate archive path: {relative}")
                  seen.add(relative)
                  if (
                      relative in skipped
                      or relative.parts[:2] == (".github", "workflows")
                      or entry.is_dir()
                  ):
                      continue
                  if any(relative in item.parents or item in relative.parents for item in files):
                      raise SystemExit(f"File/directory path collision: {relative}")
                  destination = root / relative
                  if root not in destination.resolve().parents:
                      raise SystemExit(f"Path escapes workspace: {raw}")
                  for parent in (destination, *destination.parents):
                      if parent != root and parent.is_symlink():
                          raise SystemExit(f"Symlink destination rejected: {parent}")
                  if destination.exists():
                      raise SystemExit(f"Existing file collision: {relative}")
                  files.append(relative)

              for relative in files:
                  entry = next(
                      item for item in entries
                      if Path(*PurePosixPath(item.filename).parts[1:]) == relative
                  )
                  destination = root / relative
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  with source.open(entry) as input_file, destination.open("xb") as output_file:
                      while chunk := input_file.read(1024 * 1024):
                          output_file.write(chunk)

          if files:
              subprocess.run(
                  ["git", "add", "--pathspec-from-file=-", "--pathspec-file-nul"],
                  input=b"\0".join(str(path).encode() for path in files) + b"\0",
                  check=True,
              )
          print(f"Validated archive; extracted and staged {len(files)} new files.")
          print("Preserved the repository README, archive, and separately managed CI workflow.")
          PY
      - name: Commit extracted sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'build: import PressPilot source files'
            git push
          fi
