name: Verify pilot
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Check committed browser build matches source
        run: git diff --exit-code -- frontend/dist
      - run: python -m pytest -q
        working-directory: backend
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/browser_smoke.py
      - name: Save browser verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: |
            docs/screenshots
            docs/browser-results.json
